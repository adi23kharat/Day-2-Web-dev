<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
  
    .subscriber-btn{
      background-color: rgb(226, 9, 9);
      border:none;
      border-radius: 5%;
      margin: 1px;
      padding: 10px;
      font-size: large;
      cursor: pointer;
      color: white;
      font-weight: bold;
      font-family: 'Times New Roman', Times, serif;
      
    }
    .subscriber-btn:hover{
      background-color: #be4848;
      color: black;
    }
    .join-btn{
      padding: 10px;
      border-radius: 40%;
      margin-left: 10px;
      border: rgb(153, 183, 228) 4px solid;

    }
    .tweet-btn{
      padding: 10px;
      background-color: #6da8cd;
      border-radius: 40%;
      margin-left: 10px;
      border: rgb(76, 121, 180) 4px solid;
      color: white;
      text-transform:uppercase;
      font-weight: bold;
      font-size: large;
      font-family: Arial, Helvetica, sans-serif;
    }
  </style>
</head>

<body>
  <button class="subscriber-btn">subscribe</button>
  <button class="join-btn">join</button>
  <button class="tweet-btn">tweet</button>
</body>
</html>
